# Publishes an SDK when its release tag is pushed. Registries trust this
# one workflow file through trusted publishing (OIDC): no token is stored,
# and packages get provenance. Each SDK has its own job, run only for its
# own tags:
#   typescript-v<version>  ->  @grafenodb/client on npm
# The tag must name the version in the SDK's package, which must have a
# section in the SDK's CHANGELOG.md, and the SDK is tested again (its own
# workflow) before anything is published.
name: Publish

on:
  push:
    tags: ["typescript-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  typescript-test:
    if: startsWith(github.ref_name, 'typescript-v')
    uses: ./.github/workflows/typescript.yml

  typescript:
    name: Publish @grafenodb/client to npm
    if: startsWith(github.ref_name, 'typescript-v')
    needs: typescript-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag names the package's version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "typescript-v$version" \
            || { echo "tag $GITHUB_REF_NAME, package version $version"; exit 1; }
          grep -q "^## $version" CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish
        run: npm publish
